stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  FF_DISABLE_PROFILE_LOADING: "true"

cache:
  paths:
    - .cache/pip

# LINT
lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff check app/
    - ruff format --check app/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
  allow_failure: false

# TEST
test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  variables:
    APP_ENV: "test"
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    POSTGRES_DB: test_db
    DATABASE_URL: "postgresql://test_user:test_pass@postgres:5432/test_db"
    SECRET_KEY: "test_secret_key_for_ci"
    ALGORITHMS: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    REFRESH_TOKEN_EXPIRE_DAYS: "7"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libpq-dev gcc postgresql-client
    - pip install -r requirements.txt
    - PGPASSWORD=test_pass psql -h postgres -U test_user -d test_db -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
  script:
    - alembic current || echo "No current version"
    - alembic upgrade head || (alembic stamp head && alembic upgrade head)
    - pytest --cov=app --cov-report=term-missing -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

# BUILD
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - export IMAGE_TAG=$(echo "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" | tr '[:upper:]' '[:lower:]')
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f Dockerfile.prod -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - docker logout "$CI_REGISTRY"
  only:
    - main

# DEPLOY
deploy:
  stage: deploy
  tags:
    - ec2-runner-robot
  script:
    # --- 1. Визначаємо тег образу ---
    - export IMAGE_TAG=$(echo "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" | tr '[:upper:]' '[:lower:]')

    # --- 2. Логін у реєстр GitLab ---
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    # --- 3. Завантажуємо образ ---
    - docker pull "$IMAGE_TAG"

    # --- 4. Вихід з реєстру (щоб не зберігати credentials) ---
    - docker logout "$CI_REGISTRY"

    # --- 5. Готуємо папку для деплою ---
    - mkdir -p /home/gitlab-runner/app
    - cp "$CI_PROJECT_DIR/docker-compose.prod.yml" /home/gitlab-runner/app/
    - cp "$CI_PROJECT_DIR/nginx.conf" /home/gitlab-runner/app/
    - cd /home/gitlab-runner/app

    # --- 6. Отримуємо секрети з AWS SSM ---
    - DB_PASS=$(aws ssm get-parameter --name "/prod/db_password" --with-decryption --region eu-central-1 | jq -r '.Parameter.Value')
    - APP_SECRET=$(aws ssm get-parameter --name "/prod/secret_key" --with-decryption --region eu-central-1 | jq -r '.Parameter.Value')
    - AWS_ACCESS_KEY=$(aws ssm get-parameter --name "/prod/aws_access_key_id" --with-decryption --region eu-central-1 | jq -r '.Parameter.Value')
    - AWS_SECRET_KEY=$(aws ssm get-parameter --name "/prod/aws_secret_access_key" --with-decryption --region eu-central-1 | jq -r '.Parameter.Value')

    # --- 7. Перевіряємо, що всі змінні отримані ---
    - |
      if [ -z "$DB_PASS" ]; then
        echo "ERROR: DB_PASS is empty"
        exit 1
      fi
    - |
      if [ -z "$APP_SECRET" ]; then
        echo "ERROR: APP_SECRET is empty"
        exit 1
      fi
    - |
      if [ -z "$AWS_ACCESS_KEY" ]; then
        echo "ERROR: AWS_ACCESS_KEY is empty"
        exit 1
      fi
    - |
      if [ -z "$AWS_SECRET_KEY" ]; then
        echo "ERROR: AWS_SECRET_KEY is empty"
        exit 1
      fi

    # --- 8. Створюємо .env файл (усі змінні, які реально потрібні застосунку) ---
   - echo "POSTGRES_USER=postgres" > .env
- echo "POSTGRES_PASSWORD=$DB_PASS" >> .env
- echo "POSTGRES_DB=appdb" >> .env
- echo "SECRET_KEY=$APP_SECRET" >> .env
- echo "ALGORITHMS=HS256" >> .env
- echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
- echo "REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
- echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY" >> .env
- echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY" >> .env

    # --- 9. Запускаємо контейнери ---
    - IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d --remove-orphans

    # --- 10. Виводимо логи бази даних ---
    - echo "===== DB container logs ====="
    - docker logs app-db
    - echo "============================="

    # --- 11. Перевіряємо стан контейнера ---
    - sleep 10
    - if [ "$(docker inspect -f '{{.State.Health.Status}}' app-db)" != "healthy" ]; then
      echo "❌ DB is not healthy, exiting...";
      docker compose -f docker-compose.prod.yml logs;
      exit 1;
      fi

    # --- 12. Очищаємо старі образи ---
    - docker image prune -f

    # --- 13. Перевіряємо доступність API ---
    - echo "Waiting for API to be ready..."
    - for i in $(seq 1 30); do
      curl -f http://localhost/health && break || sleep 2;
      done

    - echo "Deployment successful!"
    - docker ps
  only:
    - main
