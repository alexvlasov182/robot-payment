
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist", "migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/*" = ["E402"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["fastapi", "sqlalchemy", "alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-ending = "lf"
docstring-code-format = true
